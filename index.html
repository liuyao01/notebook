<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>纸间 · 本地笔记</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="笔记列表">
        <div class="brand-row">
          <a class="brand" href="#" aria-label="纸间首页">纸间</a>
          <button class="icon-button" id="new-note" aria-label="新建笔记" title="新建笔记">＋</button>
        </div>
        <label class="search-box" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜索笔记" autocomplete="off" />
        </label>
        <div class="list-heading"><span>全部笔记</span><span id="note-count">0</span></div>
        <nav id="note-list" class="note-list" aria-label="笔记"></nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" title="切换深色模式">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span id="theme-label">深色模式</span>
        </button>
        <p class="storage-note">所有内容仅保存在此浏览器中</p>
      </aside>

      <section class="editor" aria-label="笔记编辑器">
        <div class="editor-topbar">
          <span id="save-status" role="status">已保存</span>
          <button id="delete-note" class="text-button" type="button">删除</button>
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <p class="eyebrow">纸间</p>
          <h1>写下此刻的想法</h1>
          <p>新建一条笔记，开始记录。</p>
          <button id="empty-new-note" class="primary-button" type="button">新建笔记</button>
        </div>
        <div id="editor-fields" class="editor-fields">
          <input id="note-title" class="title-input" type="text" placeholder="无标题笔记" aria-label="笔记标题" />
          <p id="updated-at" class="updated-at"></p>
          <textarea id="note-content" placeholder="在这里开始写作…" aria-label="笔记内容"></textarea>
        </div>
      </section>
    </main>
    <template id="note-item-template">
      <button class="note-item" type="button">
        <strong class="note-item-title"></strong>
        <span class="note-item-preview"></span>
        <time class="note-item-date"></time>
      </button>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
